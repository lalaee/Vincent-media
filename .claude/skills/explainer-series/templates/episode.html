<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111;overflow:hidden}canvas{display:block}</style></head>
<body>
<!-- Explainer-series episode page (16:9). Needs, next to it: engine.js, patterns.js, scenes.js, series.json, cues.json, fonts/.
     For 9:16 copy to vertical.html, set the canvas to 1080x1920 and point it at a vertical scenes file. -->
<canvas id="F" width="1920" height="1080"></canvas>
<script type="module">
import { createEngine } from './engine.js';
import buildScenes from './scenes.js';
const [series, cues] = await Promise.all(['series.json', 'cues.json'].map(async (f) => (await fetch(f)).json()));
const canvas = document.getElementById('F');
const E = await createEngine(canvas, series, cues);
const SCENES = buildScenes(E);
window.DEMO = { width: canvas.width, height: canvas.height, fps: cues.fps, duration: cues.duration };
window.renderAt = async (t) => E.render(t, SCENES);
await window.renderAt(0);
window.__ready = true;
</script>
</body></html>
